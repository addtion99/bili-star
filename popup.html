<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bili Star</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        width: 180px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #ffffff;
        color: #222222;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .actions {
        display: grid;
        gap: 8px;
      }

      button {
        border: 1px solid #d0d7de;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        cursor: pointer;
        background: #f6f8fa;
      }

      button.primary {
        background: #00a1d6;
        border-color: #00a1d6;
        color: #ffffff;
      }

      #status {
        margin-top: 12px;
        font-size: 12px;
        color: #57606a;
      }
    </style>
  </head>
  <body>
    <h1>Bili Star</h1>
    <div class="actions">
      <button id="enable" class="primary" type="button">开启</button>
      <button id="disable" type="button">关闭</button>
    </div>
    <div id="status">当前状态：读取中</div>
    <script src="popup.js"></script>
  </body>
</html>
